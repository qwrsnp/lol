<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hola</title>
    <style>
        body {
            margin: 0;
            background-color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        .contenedor {
            width: 100vw;
            height: 100vh;
            position: relative;
            cursor: pointer;
        }

        .personaje {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
        }

        .img1 { opacity: 1; }

        /* ANIMACIÓN CAMINATA RÁPIDA */
        .animar .personaje {
            animation: secuencia 1.2s steps(1) forwards;
        }

        .animar .img1 { animation-delay: 0s; }
        .animar .img2 { animation-delay: 0.2s; }
        .animar .img3 { animation-delay: 0.4s; }
        .animar .img4 { animation-delay: 0.6s; }
        .animar .img5 { animation-delay: 0.8s; }
        .animar .img6 { 
            animation-delay: 1s; 
            animation: aparecerFinal 0.1s forwards 1s; 
        }

        @keyframes secuencia {
            0% { opacity: 1; }
            16.6% { opacity: 0; }
            100% { opacity: 0; }
        }

        @keyframes aparecerFinal {
            to { opacity: 1; }
        }

        /* BURBUJA */
        .burbuja {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: white;
            border: 3px solid #000;
            border-radius: 20px;
            padding: 10px 20px;
            font-weight: bold;
            z-index: 20;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .burbuja::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 15px 15px 0;
            border-style: solid;
            border-color: #000 transparent transparent;
        }

        .mostrar-burbuja {
            transform: translateX(-50%) scale(1);
        }

        /* VIBRACIÓN */
        @keyframes pedo-shake {
            0% { transform: scale(1); }
            50% { transform: scale(1.1) rotate(2deg); }
            100% { transform: scale(1); }
        }

        .efecto-pedo {
            animation: pedo-shake 0.1s ease-in-out 3;
        }
    </style>
</head>
<body>

    <div id="burbuja" class="burbuja">lol </div>

    <div class="contenedor" id="escena">
        <img src="hola1.png" class="personaje img1">
        <img src="hola2.png" class="personaje img2">
        <img src="hola3.png" class="personaje img3">
        <img src="hola4.png" class="personaje img4">
        <img src="hola5.png" class="personaje img5">
        <img src="hola6.png" class="personaje img6">
    </div>

    <script>
        const escena = document.getElementById('escena');
        const burbuja = document.getElementById('burbuja');
        
        // --- CAMBIÁ "pedo.mp3" POR EL NOMBRE DE TU ARCHIVO ---
        const sonidoPedo = new Audio('pedo.mp3');

        let yaCamino = false;
        let pidiendoPerdon = false;

        escena.addEventListener('click', () => {
            if (!yaCamino) {
                escena.classList.add('animar');
                yaCamino = true;
            } else if (!pidiendoPerdon) {
                pidiendoPerdon = true;
                
                // Intentamos reproducir el sonido local
                sonidoPedo.play().catch(error => {
                    console.log("Error al reproducir: ", error);
                    alert("No se pudo reproducir el audio. Chequeá el nombre del archivo.");
                });
                
                escena.classList.add('efecto-pedo');

                setTimeout(() => {
                    burbuja.classList.add('mostrar-burbuja');
                }, 600);
            }
        });
    </script>

</body>
</html>
